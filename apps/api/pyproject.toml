[project]
name = "jyotish-api"
version = "0.1.0"
description = "FastAPI backend for the Jyotish app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jyotish-engine",
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "geonamescache>=3.0.2",
    "timezonefinder>=9.2.0",
    "cryptography>=50.0.2",
    "celery[redis]>=5.6.3",
    "weasyprint>=70.0",
    "jinja2>=3.1.6",
    "pyjwt[crypto]>=2.15.1",
    "httpx>=0.28.1",
    "email-validator>=2.3.0",
]

[tool.uv.sources]
jyotish-engine = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
