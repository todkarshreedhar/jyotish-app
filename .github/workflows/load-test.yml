name: Load test

# US-53: chart API at 50 requests per second for 2 minutes; 95% must finish
# within 300 ms. Runs weekly and on demand, against a fresh API in CI.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"

jobs:
  k6:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jyotish
          POSTGRES_PASSWORD: jyotish
          POSTGRES_DB: jyotish
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U jyotish" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --all-packages --frozen
      - name: Start API (2 workers, IP limits off for the test)
        working-directory: apps/api
        env:
          IP_RATE_LIMITS: "false"
        run: |
          uv run alembic upgrade head
          nohup uv run uvicorn jyotish_api.main:app --port 8000 --workers 2 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 1; done
      - uses: grafana/setup-k6-action@v1
      - uses: grafana/run-k6-action@v1
        with:
          path: tools/load/chart.js
