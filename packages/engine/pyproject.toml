[project]
name = "jyotish-engine"
version = "0.1.0"
description = "Pure Vedic astrology calculation engine. No database, no network, no clock."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyswisseph>=2.10.3.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
