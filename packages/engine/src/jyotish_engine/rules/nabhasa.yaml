# Nabhasa yogas (BPHS ch. 13, Brihat Jataka ch. 12): patterns made by where the
# seven planets (Sun to Saturn) sit, ignoring Rahu and Ketu. Gate M4: the domain
# expert checks each rule, its source and its text, then sets reviewed: true.
# `example` gives sign numbers (1 = Aries) for a chart where the yoga is present.
- id: Y-RAJJU
  topic: career
  kind: yoga
  source: "BPHS ch. 13 (Nabhasa yogas); Brihat Jataka ch. 12"
  when: {sign_type: {type: movable}}
  example: {lagna: 1, sun: 1, moon: 4, mars: 7, mercury: 1, jupiter: 10, venus: 1, saturn: 4}
  text_key: Y-RAJJU
  reviewed: false

