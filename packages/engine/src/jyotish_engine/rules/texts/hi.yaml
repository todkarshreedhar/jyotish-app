Y-VAJRA: {title: "वज्र योग", text: "बुध, बृहस्पति और शुक्र पहले और सातवें में, और सूर्य, मंगल और शनि चौथे और दसवें में हैं। परंपरा इसे जीवन के आरंभ और अंत में सुख से जोड़ती है।"}
Y-YAVA: {title: "यव योग", text: "सूर्य, मंगल और शनि पहले और सातवें में, और बुध, बृहस्पति और शुक्र चौथे और दसवें में हैं। परंपरा इसे जीवन के मध्य भाग में सुख से जोड़ती है।"}
Y-KAMALA: {title: "कमल योग", text: "सभी ग्रह चारों केंद्रों में हैं और हर केंद्र में ग्रह है। परंपरा इसे यश, सद्गुण और लंबे सम्मानित जीवन से जोड़ती है।"}
Y-VAPI: {title: "वापी योग", text: "सभी ग्रह केंद्रों को छोड़कर पणफर या आपोक्लिम भावों में हैं। परंपरा इसे बचत और धन संभालने से जोड़ती है।"}
Y-YUPA: {title: "यूप योग", text: "सभी ग्रह पहले से चौथे भाव तक चारों भावों में हैं। परंपरा इसे दान, धार्मिक कर्म और संयम से जोड़ती है।"}
Y-SHARA: {title: "शर योग", text: "सभी ग्रह चौथे से सातवें भाव तक चारों भावों में हैं। परंपरा इसे वस्तुएँ बनाने की कला और बाहरी काम से जोड़ती है।"}
Y-SHAKTI: {title: "शक्ति योग", text: "सभी ग्रह सातवें से दसवें भाव तक चारों भावों में हैं। परंपरा इसे धीरे-धीरे, लगन से मिलने वाली सफलता के रूप में पढ़ती है।"}
Y-DANDA: {title: "दंड योग", text: "सभी ग्रह दसवें से पहले भाव तक चारों भावों में हैं। परंपरा इसे परिवार से दूरी और आत्मनिर्भरता की आवश्यकता के रूप में पढ़ती है।"}
Y-NAUKA: {title: "नौका योग", text: "सभी ग्रह पहले भाव से लगातार सात भावों में हैं। परंपरा इसे जल, व्यापार या यात्रा से आय और चंचल मन से जोड़ती है।"}
Y-KOOTA: {title: "कूट योग", text: "सभी ग्रह चौथे भाव से लगातार सात भावों में हैं। परंपरा इसे कठिन मार्ग के रूप में पढ़ती है जिसमें ईमानदारी और सावधानी चाहिए।"}
Y-CHHATRA: {title: "छत्र योग", text: "सभी ग्रह सातवें भाव से लगातार सात भावों में हैं। परंपरा इसे परिवार की देखभाल और बाद के जीवन में सुख से जोड़ती है।"}
Y-CHAPA: {title: "चाप योग", text: "सभी ग्रह दसवें भाव से लगातार सात भावों में हैं। परंपरा इसे साहस और रक्षा या सुरक्षा के पदों से जोड़ती है।"}
Y-ARDHACHANDRA: {title: "अर्धचंद्र योग", text: "सभी ग्रह ऐसे लगातार सात भावों में हैं जो केंद्र से शुरू नहीं होते। परंपरा इसे आकर्षक व्यक्तित्व और नेतृत्व से जोड़ती है।"}
Y-CHAKRA: {title: "चक्र योग", text: "सभी ग्रह लग्न से छह विषम भावों में हैं और हर भाव में ग्रह है। परंपरा इसे ऊँचे पद और अधिकार से जोड़ती है।"}
Y-SAMUDRA: {title: "समुद्र योग", text: "सभी ग्रह लग्न से छह सम भावों में हैं और हर भाव में ग्रह है। परंपरा इसे धन, सुख-सुविधा और उदार स्वभाव से जोड़ती है।"}
Y-VALLAKI: {title: "वल्लकी (वीणा) योग", text: "ग्रह सात अलग राशियों में हैं। परंपरा इसे संगीत, कला और विद्या के प्रति प्रेम से जोड़ती है। बीपीएचएस के अनुसार संख्या योग तभी लागू होते हैं जब कोई अन्य आकृति नाभस योग न हो।"}
Y-DAMINI: {title: "दामिनी योग", text: "ग्रह छह राशियों में हैं। परंपरा इसे परोपकार, धैर्य और सुख-साधन से जोड़ती है। बीपीएचएस के अनुसार संख्या योग तभी लागू होते हैं जब कोई अन्य आकृति नाभस योग न हो।"}
Y-PASA: {title: "पाश योग", text: "ग्रह पाँच राशियों में हैं। परंपरा इसे काम में कुशलता और बड़ा संपर्क-क्षेत्र से जोड़ती है। बीपीएचएस के अनुसार संख्या योग तभी लागू होते हैं जब कोई अन्य आकृति नाभस योग न हो।"}
Y-KEDARA: {title: "केदार योग", text: "ग्रह चार राशियों में हैं। परंपरा इसे खेती, भूमि और अनेक लोगों के काम आना से जोड़ती है। बीपीएचएस के अनुसार संख्या योग तभी लागू होते हैं जब कोई अन्य आकृति नाभस योग न हो।"}
Y-SHULA: {title: "शूल योग", text: "ग्रह केवल तीन राशियों में हैं। परंपरा इसे तीक्ष्णता, साहस और जल्दी क्रोध से जोड़ती है। बीपीएचएस के अनुसार संख्या योग तभी लागू होते हैं जब कोई अन्य आकृति नाभस योग न हो।"}
Y-YUGA: {title: "युग योग", text: "ग्रह केवल दो राशियों में हैं। परंपरा इसे अलग मार्ग और रीति-रिवाज से स्वतंत्रता से जोड़ती है। बीपीएचएस के अनुसार संख्या योग तभी लागू होते हैं जब कोई अन्य आकृति नाभस योग न हो।"}
Y-GOLA: {title: "गोल योग", text: "सभी ग्रह एक ही राशि में हैं। परंपरा इसे सादा जीवन जिसमें उन्नति के लिए परिश्रम और विद्या चाहिए से जोड़ती है। बीपीएचएस के अनुसार संख्या योग तभी लागू होते हैं जब कोई अन्य आकृति नाभस योग न हो।"}
Y-DHARMA-KARMADHIPATI: {title: "धर्म-कर्माधिपति योग", text: "नौवें (भाग्य) और दसवें (कर्म) भाव के स्वामी साथ हैं या राशि परिवर्तन में हैं। परंपरा इसे सबसे बलवान राज योगों में गिनती है, अपने कार्यक्षेत्र में सफलता के लिए।"}
Y-MAHA-PARIVARTANA: {title: "महा परिवर्तन योग", text: "दो शुभ भावों के स्वामी आपस में राशि बदलते हैं। परंपरा इसे धन, सुख-सुविधा और समय के साथ बढ़ते सहयोग से जोड़ती है।"}
Y-KHALA-PARIVARTANA: {title: "खल योग (परिवर्तन)", text: "तीसरे भाव का स्वामी किसी शुभ भाव के स्वामी से राशि बदलता है। परंपरा इसे बदलते भाग्य के रूप में पढ़ती है, जिसमें साहसी प्रयास से लाभ होता है।"}
Y-DAINYA-PARIVARTANA: {title: "दैन्य योग (परिवर्तन)", text: "छठे, आठवें या बारहवें भाव का स्वामी किसी अन्य स्वामी से राशि बदलता है। परंपरा इसे धैर्य से पार होने वाले संघर्ष के रूप में पढ़ती है; दोनों ग्रहों के बल के साथ देखें।"}
Y-LAKSHMI: {title: "लक्ष्मी योग", text: "नौवें भाव का स्वामी केंद्र या त्रिकोण में बलवान है और लग्न का स्वामी अच्छी स्थिति में है। परंपरा इसे धन, संस्कार और उत्तम प्रतिष्ठा से जोड़ती है।"}
Y-SARASWATI: {title: "सरस्वती योग", text: "बुध, बृहस्पति और शुक्र केंद्र, त्रिकोण या दूसरे भाव में हैं और बृहस्पति अच्छी स्थिति में है। परंपरा इसे विद्या, वाक्पटुता और कलाओं में कुशलता से जोड़ती है।"}
Y-CHAMARA: {title: "चामर योग", text: "लग्न का स्वामी केंद्र में उच्च का है और उस पर बृहस्पति की दृष्टि है। परंपरा इसे सत्ता से सम्मान, विद्या और दीर्घ जीवन से जोड़ती है।"}
Y-SHANKHA: {title: "शंख योग", text: "पाँचवें और छठे भाव के स्वामी एक-दूसरे से केंद्र में हैं और लग्न का स्वामी अच्छी स्थिति में है। परंपरा इसे दयालु स्वभाव, अच्छे परिवार और सुख से जोड़ती है।"}
Y-KAHALA: {title: "काहल योग", text: "चौथे और नौवें भाव के स्वामी एक-दूसरे से केंद्र में हैं और लग्न का स्वामी अच्छी स्थिति में है। परंपरा इसे साहस और नेतृत्व से जोड़ती है।"}
Y-BHERI: {title: "भेरी योग", text: "शुक्र, बृहस्पति और लग्न का स्वामी केंद्रों में हैं और नौवें भाव का स्वामी बलवान है। परंपरा इसे लंबे स्वस्थ जीवन, अच्छे परिवार और यश से जोड़ती है।"}
Y-PARVATA: {title: "पर्वत योग", text: "कोई शुभ ग्रह केंद्र में है और छठे या आठवें भाव में कोई पाप ग्रह नहीं है। परंपरा इसे समृद्धि, उदारता और अच्छे नाम से जोड़ती है।"}
Y-VASUMATI: {title: "वसुमती योग", text: "बुध, बृहस्पति और शुक्र लग्न या चंद्रमा से उपचय भावों (3, 6, 10, 11) में हैं। परंपरा इसे लगातार बढ़ते धन से जोड़ती है।"}
Y-SHUBHA-KARTARI: {title: "शुभ कर्तरी योग", text: "दूसरे और बारहवें दोनों भावों में शुभ ग्रह हैं, जो लग्न को घेरते हैं। परंपरा इसे सुरक्षा, अच्छे स्वास्थ्य और सुखद जीवन से जोड़ती है।"}
D-PAPA-KARTARI: {title: "पाप कर्तरी", text: "दूसरे और बारहवें दोनों भावों में पाप ग्रह हैं, जो लग्न को घेरते हैं। परंपरा इसे परिस्थितियों के दबाव के रूप में पढ़ती है; लग्न पर शुभ दृष्टि इसे कम करती है।"}
Y-LAGNADHI: {title: "लग्नाधि योग", text: "बुध, बृहस्पति और शुक्र लग्न से छठे, सातवें और आठवें भाव में हैं। परंपरा इसे सम्मानित पद, विद्या और सुख से जोड़ती है।"}
Y-GURU-MANGALA: {title: "गुरु-मंगल योग", text: "बृहस्पति और मंगल साथ हैं। परंपरा इसे विवेक से दिशा पाई ऊर्जा और तकनीकी या नेतृत्व के कामों में सफलता से जोड़ती है।"}
D-GURU-CHANDALA: {title: "गुरु-चांडाल", text: "बृहस्पति राहु के साथ है। बाद की परंपरा इसे अपरंपरागत विश्वास या सलाह पर संदेह के रूप में पढ़ती है; बृहस्पति का बल तय करता है कि इसका कितना असर है।"}
D-GRAHANA-SURYA: {title: "सूर्य ग्रहण", text: "सूर्य राहु या केतु के साथ है। बाद की परंपरा इसे आत्मविश्वास या अधिकारियों के साथ चुनौतियों के रूप में पढ़ती है; यह अकेले शारीरिक स्वास्थ्य के बारे में नहीं है।"}
D-GRAHANA-CHANDRA: {title: "चंद्र ग्रहण", text: "चंद्रमा राहु या केतु के साथ है। बाद की परंपरा इसे भावनात्मक उतार-चढ़ाव के रूप में पढ़ती है; बलवान चंद्रमा और शुभ दृष्टि इसे कम करती है।"}
D-ANGARAKA: {title: "अंगारक योग", text: "मंगल राहु के साथ है। बाद की परंपरा इसे तीव्र ऊर्जा के रूप में पढ़ती है जिसे सही दिशा देने के लिए धैर्य और सावधानी चाहिए।"}
D-VISHA: {title: "विष योग", text: "चंद्रमा शनि के साथ है। बाद की परंपरा इसे गंभीर, सावधान मन के रूप में पढ़ती है जो चिंता की ओर झुक सकता है; यह सहनशक्ति भी देता है।"}
Y-KALANIDHI: {title: "कलानिधि योग", text: "बृहस्पति दूसरे या पाँचवें भाव में है और बुध व शुक्र उसके साथ हैं या उस पर दृष्टि डालते हैं। परंपरा इसे धन, सद्गुण और सम्मान से जोड़ती है।"}
Y-BHASKARA: {title: "भास्कर योग", text: "बुध सूर्य से दूसरे, चंद्रमा बुध से ग्यारहवें और बृहस्पति चंद्रमा से त्रिकोण में है। परंपरा इसे विद्या, साहस और मजबूत स्थिति से जोड़ती है।"}
Y-MARUT: {title: "मरुत योग", text: "बृहस्पति शुक्र से त्रिकोण में, चंद्रमा बृहस्पति से पाँचवें और सूर्य चंद्रमा से केंद्र में है। परंपरा इसे वाक्पटुता, उदारता और व्यापार में सफलता से जोड़ती है।"}
Y-BUDHA: {title: "बुध योग", text: "बृहस्पति लग्न में, चंद्रमा बृहस्पति से केंद्र में, राहु चंद्रमा से दूसरे और सूर्य व मंगल राहु से तीसरे भाव में हैं। परंपरा इसे बुद्धिमत्ता और ऊँचे पद से जोड़ती है।"}
Y-INDRA: {title: "इंद्र योग", text: "पाँचवें और ग्यारहवें भाव के स्वामी राशि परिवर्तन में हैं और चंद्रमा पाँचवें भाव में है। परंपरा इसे साहस, यश और अधिकार के पद से जोड़ती है।"}
Y-SHIVA: {title: "शिव योग", text: "पाँचवें भाव का स्वामी नौवें में, नौवें का स्वामी दसवें में और दसवें का स्वामी पाँचवें में है। परंपरा इसे ज्ञान, सद्गुण और कार्य में सफलता से जोड़ती है।"}
Y-SREENATHA: {title: "श्रीनाथ योग", text: "सातवें भाव का स्वामी दसवें में उच्च का है और दसवें का स्वामी नौवें के स्वामी के साथ है। परंपरा इसे धन, मधुर वाणी और सम्मान से जोड़ती है।"}
Y-KHADGA: {title: "खड्ग योग", text: "दूसरे और नौवें भाव के स्वामी राशि परिवर्तन में हैं और लग्न का स्वामी केंद्र या त्रिकोण में है। परंपरा इसे धन, विद्या और कुशलता से जोड़ती है।"}
Y-JAYA: {title: "जय योग", text: "छठे भाव का स्वामी नीच का और दसवें का स्वामी उच्च का है। परंपरा इसे विरोधियों पर विजय और कार्यों में सफलता से जोड़ती है।"}
Y-TRILOCHANA: {title: "त्रिलोचन योग", text: "सूर्य, चंद्रमा और मंगल एक-दूसरे से त्रिकोण में हैं। परंपरा इसे धन, बुद्धि और विरोधियों पर विजय से जोड़ती है।"}
Y-KURMA: {title: "कूर्म योग", text: "बुध, बृहस्पति और शुक्र पाँचवें से सातवें भाव में, और सूर्य, मंगल और शनि पहले, तीसरे या ग्यारहवें भाव में हैं। परंपरा इसे यश, सुख और नेतृत्व से जोड़ती है।"}
Y-DHWAJA: {title: "ध्वज योग", text: "सूर्य, मंगल और शनि आठवें भाव में हैं और लग्न में शुभ ग्रह है। परंपरा इसे नेतृत्व और भीड़ से अलग पहचान से जोड़ती है।"}
Y-PRAVRAJYA: {title: "प्रव्रज्या योग", text: "चार या अधिक ग्रह एक ही राशि में हैं। परंपरा इसे वैराग्य, आध्यात्मिक साधना या किसी उद्देश्य को समर्पित जीवन की ओर झुकाव से जोड़ती है।"}
Y-DARIDRA: {title: "दरिद्र योग", text: "ग्यारहवें (लाभ) भाव का स्वामी छठे, आठवें या बारहवें भाव में है। परंपरा इसे ऐसे लाभ के रूप में पढ़ती है जिसके लिए अधिक प्रयास और सोच-समझकर खर्च चाहिए; अन्य धन योग इससे अधिक प्रभावी हो सकते हैं।"}
Y-DURYOGA: {title: "दुर्योग", text: "दसवें (कर्म) भाव का स्वामी छठे, आठवें या बारहवें भाव में है। परंपरा इसे देर से या पर्दे के पीछे मिलने वाली पहचान के रूप में पढ़ती है; लगन और सेवा से परिणाम मिलते हैं।"}
Y-KEMADRUMA-BHANGA: {title: "केमद्रुम भंग", text: "चंद्रमा के आसपास कोई ग्रह नहीं है, पर चंद्रमा से केंद्र में ग्रह है। परंपरा कहती है कि इससे केमद्रुम भंग होता है और ज़रूरत पर सहारा मिलता है।"}
Y-CHATUSSAGARA: {title: "चतुस्सागर योग", text: "हर केंद्र (पहले, चौथे, सातवें और दसवें भाव) में ग्रह है। परंपरा इसे दूर तक फैली प्रतिष्ठा, अच्छी संतान और स्थायी सफलता से जोड़ती है।"}
Y-SHUBHAMALA: {title: "शुभमाला योग", text: "बुध, बृहस्पति और शुक्र पाँचवें, छठे और सातवें भाव में हैं। परंपरा इसे सौभाग्य की माला से जोड़ती है: सुख, परिवार और सम्मान।"}
D-ASHUBHAMALA: {title: "अशुभमाला", text: "सूर्य, मंगल और शनि पाँचवें, छठे और सातवें भाव में हैं। परंपरा इसे ऐसी बाधाओं के रूप में पढ़ती है जिनमें धैर्य चाहिए; शुभ दृष्टि इसे कम करती है।"}
Y-DEVENDRA: {title: "देवेंद्र योग", text: "लग्न स्थिर राशि है, पहले और ग्यारहवें भाव के स्वामी राशि परिवर्तन में हैं, और दूसरे व दसवें के स्वामी भी। परंपरा इसे ऊँचे पद, सुख और यश से जोड़ती है।"}
Y-RAJALAKSHANA: {title: "राजलक्षण योग", text: "चंद्रमा, बुध, बृहस्पति और शुक्र सभी लग्न या अन्य केंद्रों में हैं। परंपरा इसे गरिमापूर्ण व्यक्तित्व और अच्छे गुणों से जोड़ती है।"}
