Y-HAMSA: {title: "हंस योग", text: "बृहस्पति केंद्र में बलवान है। परंपरा इसे ज्ञान, अच्छे चरित्र और दूसरों से सम्मान से जोड़ती है।"}
Y-MALAVYA: {title: "मालव्य योग", text: "शुक्र केंद्र में बलवान है। परंपरा इसे सुख-सुविधा, कलात्मक रुचि और मधुर संबंधों से जोड़ती है।"}
Y-SASA: {title: "शश योग", text: "शनि केंद्र में बलवान है। परंपरा इसे अनुशासन, सहनशक्ति और निरंतर परिश्रम से मिले अधिकार से जोड़ती है।"}
Y-GAJAKESARI: {title: "गजकेसरी योग", text: "बृहस्पति चंद्रमा से केंद्र में है। परंपरा इसे अच्छी प्रतिष्ठा, बुद्धि और स्थायी समृद्धि से जोड़ती है।"}
Y-SUNAPHA: {title: "सुनफा योग", text: "चंद्रमा से दूसरे भाव में कोई ग्रह है। परंपरा इसे स्वयं अर्जित धन और अच्छे नाम से जोड़ती है।"}
Y-ANAPHA: {title: "अनफा योग", text: "चंद्रमा से बारहवें भाव में कोई ग्रह है। परंपरा इसे अच्छे स्वास्थ्य, आकर्षक व्यक्तित्व और संतोष से जोड़ती है।"}
Y-DURUDHARA: {title: "दुरुधरा योग", text: "चंद्रमा से दूसरे और बारहवें दोनों भावों में ग्रह हैं। परंपरा इसे सुख-सुविधा, उदारता और दूसरों के सहयोग से जोड़ती है।"}
Y-KEMADRUMA: {title: "केमद्रुम योग", text: "चंद्रमा के दूसरे या बारहवें भाव में कोई ग्रह नहीं है और लग्न से केंद्र में भी कोई ग्रह नहीं है। परंपरा इसे अकेलेपन के समय के रूप में पढ़ती है; इसके कई भंग कारक हैं, इसलिए पूरी कुंडली के साथ देखें।"}
Y-VESI: {title: "वेशि योग", text: "सूर्य से दूसरे भाव में कोई ग्रह है। परंपरा इसे संतुलित स्वभाव और निरंतर प्रयास से जोड़ती है।"}
Y-VASI: {title: "वाशि योग", text: "सूर्य से बारहवें भाव में कोई ग्रह है। परंपरा इसे उदारता और कुशलता से जोड़ती है।"}
Y-UBHAYACHARI: {title: "उभयचरी योग", text: "सूर्य से दूसरे और बारहवें दोनों भावों में ग्रह हैं। परंपरा इसे योग्यता और पहचान से जोड़ती है।"}
Y-BUDHADITYA: {title: "बुधादित्य योग", text: "सूर्य और बुध साथ हैं और बुध अस्त नहीं है। परंपरा इसे बुद्धि और स्पष्ट संवाद से जोड़ती है।"}
Y-CHANDRAMANGALA: {title: "चंद्र-मंगल योग", text: "चंद्रमा और मंगल साथ हैं। परंपरा इसे उद्यम और कमाने की क्षमता से जोड़ती है, साथ में स्वभाव में तेज़ी भी।"}
Y-ADHI: {title: "अधि योग", text: "बुध, बृहस्पति और शुक्र चंद्रमा से छठे, सातवें या आठवें भाव में हैं। परंपरा इसे नेतृत्व और सुखी जीवन से जोड़ती है।"}
Y-AMALA: {title: "अमला योग", text: "लग्न या चंद्रमा से दसवें भाव में कोई शुभ ग्रह है। परंपरा इसे निर्मल प्रतिष्ठा और अच्छे कर्मों से जोड़ती है।"}
Y-RAJA-KENDRA-TRIKONA: {title: "राज योग", text: "केंद्र का स्वामी और त्रिकोण का स्वामी साथ हैं। परंपरा इसे पद और सफलता से जोड़ती है, विशेषकर उनकी दशा में।"}
Y-DHANA: {title: "धन योग", text: "धन भाव (दूसरे या ग्यारहवें) का स्वामी भाग्य भाव (पाँचवें या नौवें) के स्वामी के साथ है। परंपरा इसे लाभ और आर्थिक वृद्धि से जोड़ती है।"}
Y-HARSHA: {title: "हर्ष योग (विपरीत राज योग)", text: "छठे भाव का स्वामी दुःस्थान में है। परंपरा इसे विरोधियों पर विजय और कठिनाइयों से अच्छी तरह उबरने से जोड़ती है।"}
Y-SARALA: {title: "सरल योग (विपरीत राज योग)", text: "आठवें भाव का स्वामी दुःस्थान में है। परंपरा इसे दृढ़ता और निर्भयता से जोड़ती है।"}
Y-VIMALA: {title: "विमल योग (विपरीत राज योग)", text: "बारहवें भाव का स्वामी दुःस्थान में है। परंपरा इसे सोच-समझकर खर्च करने और स्वतंत्र स्वभाव से जोड़ती है।"}
Y-NEECHABHANGA: {title: "नीच भंग", text: "किसी नीच ग्रह की कमज़ोरी भंग होती है, क्योंकि उसकी राशि का स्वामी या वहाँ उच्च होने वाला ग्रह केंद्र में है। परंपरा इसे समय के साथ कमज़ोरी के शक्ति में बदलने के रूप में पढ़ती है।"}
Y-SHAKATA: {title: "शकट योग", text: "चंद्रमा बृहस्पति से छठे, आठवें या बारहवें भाव में है। परंपरा इसे भाग्य में उतार-चढ़ाव के रूप में पढ़ती है; लग्न से केंद्र में बृहस्पति इसे भंग करता है।"}
D-MANGLIK: {title: "मांगलिक (कुज दोष)", text: "मंगल लग्न या चंद्रमा से पहले, दूसरे, चौथे, सातवें, आठवें या बारहवें भाव में है। विवाह मिलान में इसे देखा जाता है; इसके कई परिहार हैं, इसलिए ज्योतिषी पूरी कुंडली देखें।"}
D-KALASARPA: {title: "काल सर्प", text: "सातों ग्रह राहु-केतु अक्ष के एक ही ओर हैं। यह बाद की परंपरा है और बृहत् पाराशर होरा शास्त्र में वर्णित नहीं है; सावधानी से पढ़ें।"}
P-SUN-10: {title: "दसवें भाव में सूर्य", text: "दसवें भाव में सूर्य परंपरा के अनुसार करियर, अधिकार और सार्वजनिक पहचान के लिए बलवान माना जाता है।"}
P-MOON-4: {title: "चौथे भाव में चंद्रमा", text: "चौथे भाव में चंद्रमा परंपरा के अनुसार घर, माता और भावनात्मक सुख से लगाव दर्शाता है।"}
P-JUPITER-1: {title: "लग्न में बृहस्पति", text: "पहले भाव में बृहस्पति परंपरा के अनुसार आशावाद, अच्छे निर्णय और सुरक्षा से जुड़ा है।"}
P-JUPITER-5: {title: "पाँचवें भाव में बृहस्पति", text: "पाँचवें भाव में बृहस्पति परंपरा के अनुसार विद्या, अच्छी सलाह और संतान से सुख से जुड़ा है।"}
P-JUPITER-9: {title: "नौवें भाव में बृहस्पति", text: "नौवें भाव में बृहस्पति परंपरा के अनुसार आस्था, सौभाग्य और गुरुओं के प्रति सम्मान से जुड़ा है।"}
