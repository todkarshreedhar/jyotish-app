Y-RUCHAKA: {title: "रुचक योग", text: "मंगळ केंद्रात बलवान आहे. परंपरा याला धैर्य, ऊर्जा आणि कठीण परिस्थितीत नेतृत्व करण्याच्या क्षमतेशी जोडते."}
Y-BHADRA: {title: "भद्र योग", text: "बुध केंद्रात बलवान आहे. परंपरा याला तीक्ष्ण बुद्धी, चांगली वाणी आणि शिक्षण, व्यापार किंवा लेखनातील कौशल्याशी जोडते."}
Y-HAMSA: {title: "हंस योग", text: "गुरु केंद्रात बलवान आहे. परंपरा याला ज्ञान, चांगले चारित्र्य आणि इतरांकडून मिळणाऱ्या आदराशी जोडते."}
Y-MALAVYA: {title: "मालव्य योग", text: "शुक्र केंद्रात बलवान आहे. परंपरा याला सुखसोयी, कलात्मक आवड आणि गोड नातेसंबंधांशी जोडते."}
Y-SASA: {title: "शश योग", text: "शनि केंद्रात बलवान आहे. परंपरा याला शिस्त, सहनशक्ती आणि सातत्यपूर्ण परिश्रमातून मिळणाऱ्या अधिकाराशी जोडते."}
Y-GAJAKESARI: {title: "गजकेसरी योग", text: "गुरु चंद्रापासून केंद्रात आहे. परंपरा याला चांगली प्रतिष्ठा, बुद्धी आणि टिकाऊ समृद्धीशी जोडते."}
Y-SUNAPHA: {title: "सुनफा योग", text: "चंद्रापासून दुसऱ्या स्थानात एखादा ग्रह आहे. परंपरा याला स्वकष्टार्जित धन आणि चांगल्या नावाशी जोडते."}
Y-ANAPHA: {title: "अनफा योग", text: "चंद्रापासून बाराव्या स्थानात एखादा ग्रह आहे. परंपरा याला चांगले आरोग्य, आकर्षक व्यक्तिमत्त्व आणि समाधानाशी जोडते."}
Y-DURUDHARA: {title: "दुरुधरा योग", text: "चंद्रापासून दुसऱ्या आणि बाराव्या दोन्ही स्थानांत ग्रह आहेत. परंपरा याला सुखसोयी, उदारता आणि इतरांच्या साथीशी जोडते."}
Y-KEMADRUMA: {title: "केमद्रुम योग", text: "चंद्राच्या दुसऱ्या किंवा बाराव्या स्थानात कोणताही ग्रह नाही आणि लग्नापासून केंद्रातही ग्रह नाही. परंपरा याला एकटेपणाच्या काळाप्रमाणे वाचते; याचे अनेक भंग आहेत, म्हणून संपूर्ण कुंडलीसोबत पाहा."}
Y-VESI: {title: "वेशि योग", text: "सूर्यापासून दुसऱ्या स्थानात एखादा ग्रह आहे. परंपरा याला संतुलित स्वभाव आणि सातत्यपूर्ण प्रयत्नांशी जोडते."}
Y-VASI: {title: "वाशि योग", text: "सूर्यापासून बाराव्या स्थानात एखादा ग्रह आहे. परंपरा याला उदारता आणि कौशल्याशी जोडते."}
Y-UBHAYACHARI: {title: "उभयचरी योग", text: "सूर्यापासून दुसऱ्या आणि बाराव्या दोन्ही स्थानांत ग्रह आहेत. परंपरा याला क्षमता आणि ओळख मिळण्याशी जोडते."}
Y-BUDHADITYA: {title: "बुधादित्य योग", text: "सूर्य आणि बुध एकत्र आहेत आणि बुध अस्त नाही. परंपरा याला बुद्धी आणि स्पष्ट संवादाशी जोडते."}
Y-CHANDRAMANGALA: {title: "चंद्र-मंगळ योग", text: "चंद्र आणि मंगळ एकत्र आहेत. परंपरा याला उद्यमशीलता आणि कमाईच्या क्षमतेशी जोडते, सोबत स्वभावात तडफ."}
Y-ADHI: {title: "अधि योग", text: "बुध, गुरु आणि शुक्र चंद्रापासून सहाव्या, सातव्या किंवा आठव्या स्थानात आहेत. परंपरा याला नेतृत्व आणि सुखी जीवनाशी जोडते."}
Y-AMALA: {title: "अमला योग", text: "लग्न किंवा चंद्रापासून दहाव्या स्थानात शुभ ग्रह आहे. परंपरा याला निर्मळ प्रतिष्ठा आणि सत्कर्मांशी जोडते."}
Y-RAJA-KENDRA-TRIKONA: {title: "राजयोग", text: "केंद्राचा स्वामी आणि त्रिकोणाचा स्वामी एकत्र आहेत. परंपरा याला पद आणि यशाशी जोडते, विशेषतः त्यांच्या दशेत."}
Y-DHANA: {title: "धनयोग", text: "धनस्थानाचा (दुसऱ्या किंवा अकराव्या) स्वामी भाग्यस्थानाच्या (पाचव्या किंवा नवव्या) स्वामीसोबत आहे. परंपरा याला लाभ आणि आर्थिक वाढीशी जोडते."}
Y-HARSHA: {title: "हर्ष योग (विपरीत राजयोग)", text: "षष्ठेश दुःस्थानात आहे. परंपरा याला विरोधकांवर विजय आणि अडचणींतून चांगले सावरण्याशी जोडते."}
Y-SARALA: {title: "सरल योग (विपरीत राजयोग)", text: "अष्टमेश दुःस्थानात आहे. परंपरा याला चिकाटी आणि निर्भयतेशी जोडते."}
Y-VIMALA: {title: "विमल योग (विपरीत राजयोग)", text: "व्ययेश दुःस्थानात आहे. परंपरा याला विचारपूर्वक खर्च आणि स्वतंत्र स्वभावाशी जोडते."}
Y-NEECHABHANGA: {title: "नीचभंग", text: "एखाद्या नीच ग्रहाचा दोष भंग होतो, कारण त्याच्या राशीचा स्वामी किंवा तिथे उच्च होणारा ग्रह केंद्रात आहे. परंपरा याला कालांतराने दुर्बलतेचे बलात रूपांतर म्हणून वाचते."}
Y-SHAKATA: {title: "शकट योग", text: "चंद्र गुरुपासून सहाव्या, आठव्या किंवा बाराव्या स्थानात आहे. परंपरा याला भाग्यातील चढउतार म्हणून वाचते; लग्नापासून केंद्रातील गुरु हा योग भंग करतो."}
D-MANGLIK: {title: "मांगलिक (कुज दोष)", text: "मंगळ लग्न किंवा चंद्रापासून पहिल्या, दुसऱ्या, चौथ्या, सातव्या, आठव्या किंवा बाराव्या स्थानात आहे. विवाह जुळवताना हे पाहिले जाते; याचे अनेक परिहार आहेत, म्हणून ज्योतिषाने संपूर्ण कुंडली पाहावी."}
D-KALASARPA: {title: "कालसर्प", text: "सातही ग्रह राहू-केतू अक्षाच्या एकाच बाजूला आहेत. ही नंतरची परंपरा असून बृहत् पाराशर होराशास्त्रात तिचे वर्णन नाही; काळजीपूर्वक वाचा."}
P-SUN-10: {title: "दहाव्या स्थानात सूर्य", text: "दहाव्या स्थानातील सूर्य परंपरेनुसार करिअर, अधिकार आणि सार्वजनिक ओळखीसाठी बलवान मानला जातो."}
P-MOON-4: {title: "चौथ्या स्थानात चंद्र", text: "चौथ्या स्थानातील चंद्र परंपरेनुसार घर, आई आणि भावनिक सुखाशी असलेली ओढ दर्शवतो."}
P-JUPITER-1: {title: "लग्नात गुरु", text: "पहिल्या स्थानातील गुरु परंपरेनुसार आशावाद, चांगला निर्णय आणि संरक्षणाशी जोडलेला आहे."}
P-JUPITER-5: {title: "पाचव्या स्थानात गुरु", text: "पाचव्या स्थानातील गुरु परंपरेनुसार विद्या, चांगला सल्ला आणि संततीसुखाशी जोडलेला आहे."}
P-JUPITER-9: {title: "नवव्या स्थानात गुरु", text: "नवव्या स्थानातील गुरु परंपरेनुसार श्रद्धा, सौभाग्य आणि गुरुजनांविषयी आदराशी जोडलेला आहे."}
P-VENUS-7: {title: "सातव्या स्थानात शुक्र", text: "सातव्या स्थानातील शुक्र परंपरेनुसार आकर्षक, प्रेमळ जोडीदार आणि सामाजिक आकर्षणाशी जोडलेला आहे."}
P-SATURN-10: {title: "दहाव्या स्थानात शनि", text: "दहाव्या स्थानातील शनि परंपरेनुसार परिश्रम आणि जबाबदारीतून हळूहळू घडणाऱ्या करिअरशी जोडलेला आहे."}
P-SATURN-7: {title: "सातव्या स्थानात शनि", text: "सातव्या स्थानातील शनि परंपरेनुसार प्रौढ किंवा उशिरा होणाऱ्या भागीदारीशी जोडलेला आहे, जी काळाबरोबर दृढ होते."}
P-MERCURY-1: {title: "लग्नात बुध", text: "पहिल्या स्थानातील बुध परंपरेनुसार चपळ बुद्धी, हजरजबाबीपणा आणि तरुण स्वभावाशी जोडलेला आहे."}
P-MARS-10: {title: "दहाव्या स्थानात मंगळ", text: "दहाव्या स्थानातील मंगळ परंपरेनुसार कामातील ऊर्जा आणि तांत्रिक किंवा स्पर्धात्मक क्षेत्रातील यशाशी जोडलेला आहे."}
P-LORD1-KENDRA-TRIKONA: {title: "लग्नेश शुभ स्थानी", text: "लग्नाचा स्वामी केंद्र किंवा त्रिकोणात आहे, ज्याला परंपरा आरोग्य आणि आत्मविश्वासाचा भक्कम पाया मानते."}
P-LORD1-DUSTHANA: {title: "लग्नेश सहाव्या, आठव्या किंवा बाराव्या स्थानात", text: "लग्नाचा स्वामी दुःस्थानात आहे. परंपरा आरोग्य आणि दिनचर्येकडे अधिक लक्ष देण्याचा सल्ला देते; हा वैद्यकीय सल्ला नाही."}
P-LORD10-KENDRA: {title: "दशमेश केंद्रात", text: "दहाव्या स्थानाचा स्वामी केंद्रात आहे, ज्याला परंपरा करिअर आणि प्रतिष्ठेसाठी चांगला आधार मानते."}
P-LORD7-7: {title: "सप्तमेश सातव्या स्थानात", text: "सातव्या स्थानाचा स्वामी स्वतःच्या स्थानात आहे, ज्याला परंपरा भागीदारी आणि विवाहासाठी सहायक मानते."}
P-LORD2-11: {title: "द्वितीयेश अकराव्या स्थानात", text: "दुसऱ्या स्थानाचा स्वामी अकराव्या स्थानात आहे, जे परंपरेत लाभ आणि उत्पन्नवाढीचे लक्षण आहे."}
P-LORD5-5-9: {title: "पंचमेश पाचव्या किंवा नवव्या स्थानात", text: "पाचव्या स्थानाचा स्वामी त्रिकोणात आहे, ज्याला परंपरा बुद्धी, पुण्य आणि संततीशी जोडते."}
P-MOON-STRONG: {title: "बलवान चंद्र", text: "चंद्र उच्च, मूलत्रिकोण किंवा स्वराशीत आहे. परंपरा बलवान चंद्राला भावनिक स्थैर्याशी जोडते."}
P-SUN-DEBILITATED: {title: "नीच सूर्य", text: "सूर्य तूळ राशीत आहे, जी त्याची नीच राशी आहे. परंपरा याला आत्मविश्वास वाढवण्याची गरज म्हणून वाचते; नीचभंगही तपासा."}
P-SATURN-RETRO: {title: "वक्री शनि", text: "जन्मवेळी शनि वक्री होता. परंपरा याला शिकेपर्यंत पुन्हा पुन्हा येणारे धडे म्हणून वाचते."}
P-MERCURY-COMBUST: {title: "अस्त बुध", text: "बुध सूर्याजवळ (अस्त) आहे. परंपरा याला घाईत बोलणे आणि निर्णय घेण्याबाबत काळजी घेण्याची गरज म्हणून वाचते."}
# --- Nabhasa and more classical yogas (generated layout, edit freely) ---
Y-RAJJU: {title: "रज्जू योग", text: "सातही ग्रह चर राशींमध्ये आहेत. परंपरा याला प्रवासाची आवड, महत्त्वाकांक्षा आणि घरापासून दूर काम यांच्याशी जोडते."}
Y-MUSALA: {title: "मुसल योग", text: "सातही ग्रह स्थिर राशींमध्ये आहेत. परंपरा याला दृढता, स्वाभिमान आणि स्थिर धन यांच्याशी जोडते."}
Y-NALA: {title: "नल योग", text: "सातही ग्रह द्विस्वभाव राशींमध्ये आहेत. परंपरा याला अष्टपैलूपणा आणि अनेक कामांतील कौशल्याशी जोडते."}
Y-MALA: {title: "माला योग", text: "शुभ ग्रह (चंद्र, बुध, गुरू, शुक्र) चारपैकी तीन केंद्रांत आहेत. परंपरा याला सुखसोयी, चांगली संगत आणि आनंदी जीवनाशी जोडते."}
Y-SARPA: {title: "सर्प योग", text: "पापग्रह (रवी, मंगळ, शनी) चारपैकी तीन केंद्रांत आहेत. परंपरा याला अधिक संघर्षाचे जीवन मानते; शुभ ग्रहांचा प्रभाव तो कमी करतो."}
Y-GADA: {title: "गदा योग", text: "सर्व ग्रह शेजारच्या दोन केंद्रांत आहेत. परंपरा याला परिश्रमाने मिळणारे धन आणि मान यांच्याशी जोडते."}
Y-NABHASA-SHAKATA: {title: "शकट योग (नाभस)", text: "सर्व ग्रह पहिल्या आणि सातव्या भावात आहेत. परंपरा याला प्रवासाचे कामकाजी जीवन आणि बदलते भाग्य यांच्याशी जोडते."}
Y-VIHAGA: {title: "विहग योग", text: "सर्व ग्रह चौथ्या आणि दहाव्या भावात आहेत. परंपरा याला प्रवास, संदेश आणि मध्यस्थाच्या कामाशी जोडते."}
Y-SRINGATAKA: {title: "शृंगाटक योग", text: "सर्व ग्रह त्रिकोणांत (पहिला, पाचवा आणि नववा भाव) आहेत. परंपरा याला सुखी वैवाहिक जीवन आणि उत्तर आयुष्यातील भाग्याशी जोडते."}
Y-HALA: {title: "हल योग", text: "सर्व ग्रह लग्नाव्यतिरिक्त दुसऱ्या त्रिकोण-समूहात आहेत. परंपरा याला शेती, जमीन आणि कष्टाळू स्वभावाशी जोडते."}
Y-VAJRA: {title: "वज्र योग", text: "बुध, गुरू आणि शुक्र पहिल्या व सातव्यात, आणि रवी, मंगळ व शनी चौथ्या व दहाव्यात आहेत. परंपरा याला आयुष्याच्या सुरुवातीला आणि शेवटी सुखाशी जोडते."}
Y-YAVA: {title: "यव योग", text: "रवी, मंगळ आणि शनी पहिल्या व सातव्यात, आणि बुध, गुरू व शुक्र चौथ्या व दहाव्यात आहेत. परंपरा याला आयुष्याच्या मधल्या काळातील सुखाशी जोडते."}
Y-KAMALA: {title: "कमल योग", text: "सर्व ग्रह चारही केंद्रांत आहेत आणि प्रत्येक केंद्रात ग्रह आहे. परंपरा याला कीर्ती, सद्गुण आणि दीर्घ सन्मानित जीवनाशी जोडते."}
Y-VAPI: {title: "वापी योग", text: "सर्व ग्रह केंद्रे सोडून पणफर किंवा आपोक्लिम भावांत आहेत. परंपरा याला बचत आणि धन सांभाळण्याशी जोडते."}
Y-YUPA: {title: "यूप योग", text: "सर्व ग्रह पहिल्या ते चौथ्या भावापर्यंत चारही भावांत आहेत. परंपरा याला दान, धार्मिक कर्म आणि संयमाशी जोडते."}
Y-SHARA: {title: "शर योग", text: "सर्व ग्रह चौथ्या ते सातव्या भावापर्यंत चारही भावांत आहेत. परंपरा याला वस्तू घडवण्याचे कौशल्य आणि बाहेरच्या कामाशी जोडते."}
Y-SHAKTI: {title: "शक्ती योग", text: "सर्व ग्रह सातव्या ते दहाव्या भावापर्यंत चारही भावांत आहेत. परंपरा याला चिकाटीने हळूहळू मिळणारे यश मानते."}
Y-DANDA: {title: "दंड योग", text: "सर्व ग्रह दहाव्या ते पहिल्या भावापर्यंत चारही भावांत आहेत. परंपरा याला कुटुंबापासून अंतर आणि स्वावलंबनाची गरज मानते."}
Y-NAUKA: {title: "नौका योग", text: "सर्व ग्रह पहिल्या भावापासून सलग सात भावांत आहेत. परंपरा याला पाणी, व्यापार किंवा प्रवासातून कमाई आणि चंचल मनाशी जोडते."}
Y-KOOTA: {title: "कूट योग", text: "सर्व ग्रह चौथ्या भावापासून सलग सात भावांत आहेत. परंपरा याला कठीण मार्ग मानते ज्यात प्रामाणिकपणा आणि काळजी लागते."}
Y-CHHATRA: {title: "छत्र योग", text: "सर्व ग्रह सातव्या भावापासून सलग सात भावांत आहेत. परंपरा याला कुटुंबाची काळजी आणि उत्तर आयुष्यातील सुखाशी जोडते."}
Y-CHAPA: {title: "चाप योग", text: "सर्व ग्रह दहाव्या भावापासून सलग सात भावांत आहेत. परंपरा याला धैर्य आणि रक्षण किंवा सुरक्षेच्या पदांशी जोडते."}
Y-ARDHACHANDRA: {title: "अर्धचंद्र योग", text: "सर्व ग्रह केंद्राशिवाय सुरू होणाऱ्या सलग सात भावांत आहेत. परंपरा याला आकर्षक व्यक्तिमत्त्व आणि नेतृत्वाशी जोडते."}
Y-CHAKRA: {title: "चक्र योग", text: "सर्व ग्रह लग्नापासून सहा विषम भावांत आहेत आणि प्रत्येकात ग्रह आहे. परंपरा याला उच्च पद आणि अधिकाराशी जोडते."}
Y-SAMUDRA: {title: "समुद्र योग", text: "सर्व ग्रह लग्नापासून सहा सम भावांत आहेत आणि प्रत्येकात ग्रह आहे. परंपरा याला धन, सुखसोयी आणि उदार स्वभावाशी जोडते."}
Y-VALLAKI: {title: "वल्लकी (वीणा) योग", text: "ग्रह सात वेगवेगळ्या राशींत आहेत. परंपरा याला संगीत, कला आणि विद्येची आवड यांच्याशी जोडते. बीपीएचएसनुसार संख्या योग इतर कोणताही आकृती नाभस योग नसेल तेव्हाच लागू होतात."}
Y-DAMINI: {title: "दामिनी योग", text: "ग्रह सहा राशींत आहेत. परंपरा याला परोपकार, संयम आणि सुखसोयी यांच्याशी जोडते. बीपीएचएसनुसार संख्या योग इतर कोणताही आकृती नाभस योग नसेल तेव्हाच लागू होतात."}
Y-PASA: {title: "पाश योग", text: "ग्रह पाच राशींत आहेत. परंपरा याला कामातील कौशल्य आणि मोठा संपर्क यांच्याशी जोडते. बीपीएचएसनुसार संख्या योग इतर कोणताही आकृती नाभस योग नसेल तेव्हाच लागू होतात."}
Y-KEDARA: {title: "केदार योग", text: "ग्रह चार राशींत आहेत. परंपरा याला शेती, जमीन आणि अनेकांच्या उपयोगी पडणे यांच्याशी जोडते. बीपीएचएसनुसार संख्या योग इतर कोणताही आकृती नाभस योग नसेल तेव्हाच लागू होतात."}
Y-SHULA: {title: "शूल योग", text: "ग्रह फक्त तीन राशींत आहेत. परंपरा याला तीक्ष्णता, धैर्य आणि लवकर येणारा राग यांच्याशी जोडते. बीपीएचएसनुसार संख्या योग इतर कोणताही आकृती नाभस योग नसेल तेव्हाच लागू होतात."}
Y-YUGA: {title: "युग योग", text: "ग्रह फक्त दोन राशींत आहेत. परंपरा याला वेगळी वाट आणि रूढींपासून स्वातंत्र्य यांच्याशी जोडते. बीपीएचएसनुसार संख्या योग इतर कोणताही आकृती नाभस योग नसेल तेव्हाच लागू होतात."}
Y-GOLA: {title: "गोल योग", text: "सर्व ग्रह एकाच राशीत आहेत. परंपरा याला साधे जीवन ज्यात प्रगतीसाठी परिश्रम आणि विद्या लागते यांच्याशी जोडते. बीपीएचएसनुसार संख्या योग इतर कोणताही आकृती नाभस योग नसेल तेव्हाच लागू होतात."}
Y-DHARMA-KARMADHIPATI: {title: "धर्म-कर्माधिपती योग", text: "नवव्या (भाग्य) आणि दहाव्या (कर्म) भावाचे स्वामी एकत्र आहेत किंवा राशी परिवर्तनात आहेत. परंपरा याला सर्वात बलवान राजयोगांपैकी मानते, आपल्या कार्यक्षेत्रातील यशासाठी."}
Y-MAHA-PARIVARTANA: {title: "महा परिवर्तन योग", text: "दोन शुभ भावांचे स्वामी परस्परांची राशी बदलतात. परंपरा याला धन, सुखसोयी आणि काळानुसार वाढणाऱ्या आधाराशी जोडते."}
Y-KHALA-PARIVARTANA: {title: "खल योग (परिवर्तन)", text: "तिसऱ्या भावाचा स्वामी एखाद्या शुभ भावाच्या स्वामीशी राशी बदलतो. परंपरा याला बदलते भाग्य मानते, ज्यात धाडसी प्रयत्नांतून लाभ होतो."}
Y-DAINYA-PARIVARTANA: {title: "दैन्य योग (परिवर्तन)", text: "सहाव्या, आठव्या किंवा बाराव्या भावाचा स्वामी दुसऱ्या स्वामीशी राशी बदलतो. परंपरा याला संयमाने पार होणारा संघर्ष मानते; दोन्ही ग्रहांच्या बलासह पाहा."}
Y-LAKSHMI: {title: "लक्ष्मी योग", text: "नवव्या भावाचा स्वामी केंद्र किंवा त्रिकोणात बलवान आहे आणि लग्नेश चांगल्या स्थितीत आहे. परंपरा याला धन, संस्कार आणि उत्तम प्रतिष्ठेशी जोडते."}
Y-SARASWATI: {title: "सरस्वती योग", text: "बुध, गुरू आणि शुक्र केंद्र, त्रिकोण किंवा दुसऱ्या भावात आहेत आणि गुरू चांगल्या स्थितीत आहे. परंपरा याला विद्या, वक्तृत्व आणि कलांतील कौशल्याशी जोडते."}
Y-CHAMARA: {title: "चामर योग", text: "लग्नेश केंद्रात उच्चीचा आहे आणि त्यावर गुरूची दृष्टी आहे. परंपरा याला सत्तेकडून सन्मान, विद्या आणि दीर्घायुष्याशी जोडते."}
Y-SHANKHA: {title: "शंख योग", text: "पाचव्या आणि सहाव्या भावाचे स्वामी परस्परांपासून केंद्रात आहेत आणि लग्नेश चांगल्या स्थितीत आहे. परंपरा याला दयाळू स्वभाव, चांगले कुटुंब आणि सुखाशी जोडते."}
Y-KAHALA: {title: "काहल योग", text: "चौथ्या आणि नवव्या भावाचे स्वामी परस्परांपासून केंद्रात आहेत आणि लग्नेश चांगल्या स्थितीत आहे. परंपरा याला धैर्य आणि नेतृत्वाशी जोडते."}
Y-BHERI: {title: "भेरी योग", text: "शुक्र, गुरू आणि लग्नेश केंद्रांत आहेत आणि नवव्या भावाचा स्वामी बलवान आहे. परंपरा याला दीर्घ निरोगी जीवन, चांगले कुटुंब आणि कीर्तीशी जोडते."}
Y-PARVATA: {title: "पर्वत योग", text: "एखादा शुभ ग्रह केंद्रात आहे आणि सहाव्या किंवा आठव्या भावात कोणताही पापग्रह नाही. परंपरा याला समृद्धी, उदारता आणि चांगल्या नावाशी जोडते."}
Y-VASUMATI: {title: "वसुमती योग", text: "बुध, गुरू आणि शुक्र लग्न किंवा चंद्रापासून उपचय भावांत (3, 6, 10, 11) आहेत. परंपरा याला सतत वाढणाऱ्या धनाशी जोडते."}
Y-SHUBHA-KARTARI: {title: "शुभ कर्तरी योग", text: "दुसऱ्या आणि बाराव्या दोन्ही भावांत शुभ ग्रह आहेत, जे लग्नाला वेढतात. परंपरा याला संरक्षण, चांगले आरोग्य आणि सुखद जीवनाशी जोडते."}
D-PAPA-KARTARI: {title: "पाप कर्तरी", text: "दुसऱ्या आणि बाराव्या दोन्ही भावांत पापग्रह आहेत, जे लग्नाला वेढतात. परंपरा याला परिस्थितीचा दबाव मानते; लग्नावरील शुभ दृष्टी तो कमी करते."}
Y-LAGNADHI: {title: "लग्नाधि योग", text: "बुध, गुरू आणि शुक्र लग्नापासून सहाव्या, सातव्या आणि आठव्या भावात आहेत. परंपरा याला सन्मानाचे पद, विद्या आणि सुखाशी जोडते."}
Y-GURU-MANGALA: {title: "गुरू-मंगळ योग", text: "गुरू आणि मंगळ एकत्र आहेत. परंपरा याला विवेकाने दिशा मिळालेली ऊर्जा आणि तांत्रिक किंवा नेतृत्वाच्या कामांतील यशाशी जोडते."}
D-GURU-CHANDALA: {title: "गुरू-चांडाळ", text: "गुरू राहूसोबत आहे. नंतरची परंपरा याला अपारंपरिक श्रद्धा किंवा सल्ल्याविषयी शंका मानते; याचा परिणाम किती ते गुरूच्या बलावर ठरते."}
D-GRAHANA-SURYA: {title: "सूर्य ग्रहण", text: "रवी राहू किंवा केतूसोबत आहे. नंतरची परंपरा याला आत्मविश्वास किंवा अधिकाऱ्यांशी संबंधित आव्हाने मानते; हे केवळ शारीरिक आरोग्याबद्दल नाही."}
D-GRAHANA-CHANDRA: {title: "चंद्र ग्रहण", text: "चंद्र राहू किंवा केतूसोबत आहे. नंतरची परंपरा याला भावनिक चढ-उतार मानते; बलवान चंद्र आणि शुभ दृष्टी ते कमी करतात."}
D-ANGARAKA: {title: "अंगारक योग", text: "मंगळ राहूसोबत आहे. नंतरची परंपरा याला तीव्र ऊर्जा मानते जिला योग्य दिशा देण्यासाठी संयम आणि काळजी लागते."}
D-VISHA: {title: "विष योग", text: "चंद्र शनीसोबत आहे. नंतरची परंपरा याला गंभीर, सावध मन मानते जे काळजीकडे झुकू शकते; हे सहनशक्तीही देते."}
Y-KALANIDHI: {title: "कलानिधी योग", text: "गुरू दुसऱ्या किंवा पाचव्या भावात आहे आणि बुध व शुक्र त्याच्यासोबत आहेत किंवा त्यावर दृष्टी टाकतात. परंपरा याला धन, सद्गुण आणि सन्मानाशी जोडते."}
Y-BHASKARA: {title: "भास्कर योग", text: "बुध रवीपासून दुसरा, चंद्र बुधापासून अकरावा आणि गुरू चंद्रापासून त्रिकोणात आहे. परंपरा याला विद्या, धैर्य आणि भक्कम स्थानाशी जोडते."}
Y-MARUT: {title: "मरुत योग", text: "गुरू शुक्रापासून त्रिकोणात, चंद्र गुरूपासून पाचवा आणि रवी चंद्रापासून केंद्रात आहे. परंपरा याला वक्तृत्व, उदारता आणि व्यापारातील यशाशी जोडते."}
Y-BUDHA: {title: "बुध योग", text: "गुरू लग्नात, चंद्र गुरूपासून केंद्रात, राहू चंद्रापासून दुसरा आणि रवी व मंगळ राहूपासून तिसऱ्या भावात आहेत. परंपरा याला बुद्धिमत्ता आणि उच्च पदाशी जोडते."}
Y-INDRA: {title: "इंद्र योग", text: "पाचव्या आणि अकराव्या भावाचे स्वामी राशी परिवर्तनात आहेत आणि चंद्र पाचव्या भावात आहे. परंपरा याला धैर्य, कीर्ती आणि अधिकाराच्या पदाशी जोडते."}
Y-SHIVA: {title: "शिव योग", text: "पाचव्या भावाचा स्वामी नवव्यात, नवव्याचा स्वामी दहाव्यात आणि दहाव्याचा स्वामी पाचव्यात आहे. परंपरा याला ज्ञान, सद्गुण आणि कार्यातील यशाशी जोडते."}
Y-SREENATHA: {title: "श्रीनाथ योग", text: "सातव्या भावाचा स्वामी दहाव्यात उच्चीचा आहे आणि दहाव्याचा स्वामी नवव्याच्या स्वामीसोबत आहे. परंपरा याला धन, मधुर वाणी आणि सन्मानाशी जोडते."}
Y-KHADGA: {title: "खड्ग योग", text: "दुसऱ्या आणि नवव्या भावाचे स्वामी राशी परिवर्तनात आहेत आणि लग्नेश केंद्र किंवा त्रिकोणात आहे. परंपरा याला धन, विद्या आणि कौशल्याशी जोडते."}
Y-JAYA: {title: "जय योग", text: "सहाव्या भावाचा स्वामी नीचीचा आणि दहाव्याचा स्वामी उच्चीचा आहे. परंपरा याला विरोधकांवर विजय आणि कार्यांतील यशाशी जोडते."}
Y-TRILOCHANA: {title: "त्रिलोचन योग", text: "रवी, चंद्र आणि मंगळ परस्परांपासून त्रिकोणात आहेत. परंपरा याला धन, बुद्धी आणि विरोधकांवर विजयाशी जोडते."}
Y-KURMA: {title: "कूर्म योग", text: "बुध, गुरू आणि शुक्र पाचव्या ते सातव्या भावात, आणि रवी, मंगळ व शनी पहिल्या, तिसऱ्या किंवा अकराव्या भावात आहेत. परंपरा याला कीर्ती, सुख आणि नेतृत्वाशी जोडते."}
Y-DHWAJA: {title: "ध्वज योग", text: "रवी, मंगळ आणि शनी आठव्या भावात आहेत आणि लग्नात शुभ ग्रह आहे. परंपरा याला नेतृत्व आणि गर्दीपेक्षा वेगळी ओळख यांच्याशी जोडते."}
Y-PRAVRAJYA: {title: "प्रव्रज्या योग", text: "चार किंवा अधिक ग्रह एकाच राशीत आहेत. परंपरा याला वैराग्य, आध्यात्मिक साधना किंवा एखाद्या ध्येयाला वाहिलेल्या जीवनाकडील ओढीशी जोडते."}
Y-DARIDRA: {title: "दरिद्र योग", text: "अकराव्या (लाभ) भावाचा स्वामी सहाव्या, आठव्या किंवा बाराव्या भावात आहे. परंपरा याला अधिक प्रयत्न आणि विचारपूर्वक खर्च लागणारा लाभ मानते; इतर धनयोग याहून प्रभावी ठरू शकतात."}
Y-DURYOGA: {title: "दुर्योग", text: "दहाव्या (कर्म) भावाचा स्वामी सहाव्या, आठव्या किंवा बाराव्या भावात आहे. परंपरा याला उशिरा किंवा पडद्याआड मिळणारी ओळख मानते; चिकाटी आणि सेवेने फळ मिळते."}
Y-KEMADRUMA-BHANGA: {title: "केमद्रुम भंग", text: "चंद्राच्या आजूबाजूला ग्रह नाही, पण चंद्रापासून केंद्रात ग्रह आहे. परंपरा सांगते की यामुळे केमद्रुमाचा भंग होतो आणि गरजेच्या वेळी आधार मिळतो."}
Y-CHATUSSAGARA: {title: "चतुस्सागर योग", text: "प्रत्येक केंद्रात (पहिला, चौथा, सातवा आणि दहावा भाव) ग्रह आहे. परंपरा याला दूरवर पसरलेली प्रतिष्ठा, चांगली संतती आणि टिकाऊ यशाशी जोडते."}
Y-SHUBHAMALA: {title: "शुभमाला योग", text: "बुध, गुरू आणि शुक्र पाचव्या, सहाव्या आणि सातव्या भावात आहेत. परंपरा याला सौभाग्याची माळ मानते: सुख, कुटुंब आणि सन्मान."}
D-ASHUBHAMALA: {title: "अशुभमाला", text: "रवी, मंगळ आणि शनी पाचव्या, सहाव्या आणि सातव्या भावात आहेत. परंपरा याला संयम लागणारे अडथळे मानते; शुभ दृष्टी ते कमी करते."}
Y-DEVENDRA: {title: "देवेंद्र योग", text: "लग्न स्थिर राशी आहे, पहिल्या आणि अकराव्या भावाचे स्वामी राशी परिवर्तनात आहेत, आणि दुसऱ्या व दहाव्याचे स्वामीही. परंपरा याला उच्च पद, सुख आणि कीर्तीशी जोडते."}
Y-RAJALAKSHANA: {title: "राजलक्षण योग", text: "चंद्र, बुध, गुरू आणि शुक्र सर्व लग्न किंवा इतर केंद्रांत आहेत. परंपरा याला रुबाबदार व्यक्तिमत्त्व आणि चांगल्या गुणांशी जोडते."}
