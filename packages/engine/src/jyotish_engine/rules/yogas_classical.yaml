  topic: career
  kind: yoga
  source: "BPHS ch. 39 (Raja yogas)"
  when: {any: [{lords_conjunct: {a: [9], b: [10], distinct: true}}, {exchange: {a: [9], b: [10]}}]}
  example: {lagna: 1, jupiter: 5, saturn: 5}
  text_key: Y-DHARMA-KARMADHIPATI
  reviewed: false

