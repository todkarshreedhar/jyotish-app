# More classical yogas (Phaladeepika ch. 6, BPHS, Saravali, Brihat Jataka) and
# some later-tradition doshas, marked as such in `source`. Gate M4: the domain
# expert checks each rule, its source and its text, then sets reviewed: true.
# `example` gives sign numbers (1 = Aries) for a chart where the yoga is present.
