
[project]
name = "jyotish-app"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/engine"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "skyfield>=1.55",
    "skyfield-data>=7.0.0",
    "ruff>=0.17.3",
    "mypy>=2.4.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = [
    "apps/api/tests",
    "packages/engine/tests",
]
